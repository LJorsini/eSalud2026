<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="mb-6">
        <h1 class="fs-3 mb-1">Médicos</h1>
        <p class="mb-0">Listado de médicos (contenido pendiente).</p>
      </div>
      <!-- <div>
              <a href="#create-product" class="btn btn-primary">Add Product</a>
      </div> -->
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#nuevoMedico">
        Nuevo Medico
      </button>

      <!-- Modal -->
      <div class="modal fade" id="nuevoMedico" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body p-4">
              <form id="addProductForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productName" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="productName" placeholder="Enter product name" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="productSKU" class="form-label">SKU</label>
                    <input type="text" class="form-control" id="productSKU" placeholder="Enter SKU" required>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productPrice" class="form-label">Price</label>
                    <input type="number" class="form-control" id="productPrice" placeholder="0.00" step="0.01" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="productStock" class="form-label">Stock Quantity</label>
                    <input type="number" class="form-control" id="productStock" placeholder="0" required>
                  </div>
                </div>

                
                <!-- <div class="mb-3">
                  <label for="productImage" class="form-label">Product Image</label>
                  <input type="file" class="form-control" id="productImage" accept="image/*" required>
                </div> -->
                <div class="mb-3">
                  <label for="productDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="productDescription" rows="4"
                    placeholder="Enter product description"></textarea>
                </div>
                

              </form>
            </div>
          </div>


        </div>

      </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary">Save changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
