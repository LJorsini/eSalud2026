<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="">
                    <h1 class="mb-1">Administradores</h1>
                    <p id="mensajeTablaVacia" class="tablaVacia"></p>
                </div>
                <div>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#modalAdministradores">
                        Nuevo Administrador
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card table-responsive">
        <table class="table mb-0 text-nowrap">
            <thead class="table-light border-light">
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Fecha Nacimiento</th>
                    <th scope="col">DNI</th>

                    <th scope="col"></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody id="tbodyAdministradores">

            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalAdministradores" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="tituloModal"></h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body p-4">
                                <form id="addProductForm">
                                    <input type="" id="administradorId" value="0" />

                                    <div class="row">
                                        <div class="col-md-7 mb-3">
                                            <label for="nombreAdministrador" class="form-label">Nombre Completo</label>
                                            <input type="text" class="form-control mayuscula" id="nombreAdministrador" placeholder="Ingrese el nombre completo"/>
                                            <span id="errorNombreCompleto" class="errorCampoVacio"></span>
                                        </div>

                                        <div class="col-md-5 mb-3">
                                            <label for="dniAdministrador" class="form-label">DNI</label>
                                            <input type="text" class="form-control mayuscula" id="dniAdministrador" placeholder="Ingrese el dni"/>
                                            <span id="errordni" class="errorCampoVacio"></span>
                                        </div>

                                        
                                    </div>

                                    <div class="row">

                                        <div class="col-md-7 mb-3">
                                            <label for="fechaNacimientoAdministrador" class="form-label">Fecha de Nacimiento</label>
                                            <input type="date" class="form-control mayuscula" id="fechaNacimientoAdministrador" placeholder="Ingrese la fecha de nacimiento"/>
                                            <span id="errorFechaNacimiento" class="errorCampoVacio"></span>
                                        </div>

                                        <div class="col-md-5 mb-3">
                                            <label for="generoAdministrador" class="form-label">Genero</label>
                                            <select class="form-select" id="generoAdministrador">
                                                <option value="">-- Seleccione un genero --</option>
                                                <option value="1">Masculino</option>
                                                <option value="2">Femenino</option>
                                                <option value="3">No Especifica</option>
                                            </select>
                                            <span id="errorGenero" class="errorCampoVacio"></span>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-7 mb-3">
                                            <label for="direccionAdministrador" class="form-label">Direccion</label>
                                            <input type="text" class="form-control mayuscula" id="direccionAdministrador" placeholder="Ingrese la direccion"/>  
                                            <span id="errorDireccion" class="errorCampoVacio"></span>
                                        </div>

                                        <div class="col-md-5 mb-3">
                                            <label for="telefonoAdministrador" class="form-label">Telefono</label>
                                            <input type="text" class="form-control mayuscula" id="telefonoAdministrador" placeholder="Ingrese el telefono"/>  
                                            <span id="errortelefono" class="errorCampoVacio"></span>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-12 mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control mayuscula" id="email" placeholder="Ingrese un email"/>  
                                            <span id="errorEmail" class="errorCampoVacio"></span>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-12 mb-3">
                                            <label for="selectProvincias" class="form-label">Provincia</label>
                                                <select class="form-select" id="selectProvincias">
                                                    <option value="" >-- Seleccione la provincia --</option>
                                                </select>
                                                <span id="errorSeleccionProvincia" class="errorCampoVacio"></span>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-8 mb-3">
                                            <label for="selectLocalidad" class="form-label">Localidad</label>
                                                <select class="form-select" id="selectLocalidad">
                                                    <option value="" >-- Seleccione la localidad --</option>
                                                </select>
                                                <span id="errorSeleccionLocalidad" class="errorCampoVacio"></span>
                                        </div>

                                        <div class="col-md-4">
                                            <label for="crearLocalidad" class="form-label">Si no existe la localidad</label>
                                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalLocalidad">
                                                Crear Localidad
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-primary" onclick="CrearEditarAdministrador()">
                    Guardar
                </button>
            </div>
        </div>
    </div>
</div>




<!-- Crear localidad -->

<!-- Modal -->
<div class="modal fade" id="modalLocalidad" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="tituloModal">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-body p-4">
                <form id="addProductForm">

                  <input type="" id="localidadId" value="0" />

                  <div class="row">
                    <div class="col-md-8 mb-3">
                      <label for="nombreLocalidad" class="form-label">Nombre Localidad</label>
                      <input type="text" class="form-control mayuscula" id="nombreLocalidad"
                        placeholder="Ingrese el nombre de la localidad">
                      <span id="errorNombreLocalidad" class="errorCampoVacio"></span>
                    </div>

                    <div class="col-md-4 mb-3">
                      <label for="cpLocalidad" class="form-label">Codigo postal</label>
                      <input type="text" class="form-control mayuscula" id="cpLocalidad"
                        placeholder="Ingrese el codigo postal">
                      <span id="errorCP" class="errorCampoVacio"></span>
                    </div>
                    
                  </div>                 
                  <div class="mb-3">
                    <label for="selectProvincias" class="form-label">Provincia</label>
                    <select class="form-select" id="selectProvincias">
                      <option value="" >-- Seleccione la provincia --</option>
                    </select>
                    <span id="errorSeleccionProvincia" class="errorCampoVacio"></span>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal" >Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="CrearLocalidad()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/administradores.js"></script>
