<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="">
          <h1 class="fs-3 mb-1">Localidades</h1>
          <p id="mensajeTablaVacia" class="tablaVacia"></p>
        </div>
        <div>
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalLocalidad">
            Agregar Localidad
          </button>
        </div>
      </div>
    </div>
  </div>


  <!-- Tabla -->
  <div class="card table-responsive">
    <table class="table mb-0 text-nowrap table-hover">
      <thead class="table-light border-light">
        <tr>
          <th scope="col">Localidad</th>
          <th scope="col">Provincia</th>
          <th scope="col"></th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody class="tbodyLocalidades">

      </tbody>
    </table>
  </div>



</div>




<!-- Modal -->
<div class="modal fade" id="modalLocalidad" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-body p-4">
                <form id="addProductForm">

                  <input type="" id="localidadId" value="0" />

                  <div class="row">
                    <div class="col-md-12 mb-3">
                      <label for="nombreLocalidad" class="form-label">Nombre Localidad</label>
                      <input type="text" class="form-control" id="nombreLocalidad"
                        placeholder="Ingrese el nombre de la localidad">
                    </div>
                  </div>


                  <div class="mb-3">
                    <label for="selectProvincias" class="form-label">Provincia</label>
                    <select class="form-select" id="selectProvincias">
                      <option value="" >-- Seleccione la provincia --</option>
                    </select>
                  </div>




                </form>
              </div>
            </div>


          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="CargarEditarLocalidad()">Gyardar</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/localidades.js"></script>
