<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión - eSalud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="../img/favicon_io/site.webmanifest">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../libr/tabler-icons/tabler-icons.min.css" rel="stylesheet">
</head>

<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card " style="max-width:420px; width:100%;">
    
    <div class="card-body p-5">
      <div class="text-center mb-3">
      <a href="index.html" class="mb-4 d-inline-block"><img src="../img/logo-icon.svg" alt="" width="36">
      <span class=" ms-2"> <img src="../img/logo-1.svg" alt=""></span>
      </a>
        <h1 class="card-title mb-5 h5">Ingrese a su cuenta</h1>

      </div>

      <form id="loginForm" class="needs-validation mt-3" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Direccion de Email</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" required autofocus>
          <span id="errorEmail" class="errorCampoVacio"></span>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label d-flex justify-content-between">
            <span>Contraseña</span>
            <a href="#" class="small link-primary">¿Olvido la contraseña?</a>
          </label>
          <input id="password" type="password" class="form-control" placeholder="Contraseña" required minlength="6">
          <!-- <div class="invalid-feedback">Please provide a password (min 6 characters).</div> -->
          <span id="errorPassword" class="errorCampoVacio"></span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input id="remember" class="form-check-input" type="checkbox">
            <label class="form-check-label small" for="remember">Mantener sesion abierta</label>
          </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>

      <!-- <div class="text-center mt-3 small text-muted">
        ¿No tiene cuenta? <a href="signup.html" class="link-primary">Crear cuenta</a>
      </div> -->
    </div>
  </div>
</div>

  <!-- Página independiente: no carga main.js ni sidebar.js, no tiene navbar/sidebar -->
  <script src="../libr/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
