<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Crear cuenta - eSalud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="../img/favicon_io/site.webmanifest">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../libr/tabler-icons/tabler-icons.min.css" rel="stylesheet">
</head>

<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card " style="max-width:420px; width:100%;">
    <div class="card-body p-5">
      <div class="text-center mb-3">
     <a href="index.html" class="mb-4 d-inline-block"><img src="../img/logo-icon.svg" alt="" width="36">
      <span class="ms-2"> <img src="../img/logo-1.svg" alt=""></span>
      </a>
        <h1 class="card-title mb-5 h5">Crear cuenta</h1>

      </div>

      <form id="formularioRegistro" class="needs-validation mt-3" novalidate>
        <div class="mb-3">
          <label for="nombreCompleto" class="form-label">Nombre completo</label>
          <input id="nombreCompleto" type="text" class="form-control" placeholder="Ingrese nombre y apellido" required>
          <div class="invalid-feedback">Por favor ingrese su nombre.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Direccion de E-mail</label>
          <input id="email" type="email" class="form-control" placeholder="ingrese su email" required>
          <div class="invalid-feedback">Ingrese su email.</div>
        </div>

        <div class="mb-3">
          <label for="dni" class="form-label">DNI</label>
          <input id="dni" type="text" class="form-control" placeholder="ingrese su DNI" required>
          <div class="invalid-feedback">Ingrese su email.</div>
        </div>

        <!-- <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Create a password" required minlength="6">
          <div class="invalid-feedback">Please provide a password (min 6 characters).</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <input id="confirmPassword" type="password" class="form-control" placeholder="Repeat password" required
            oninput="this.setCustomValidity(document.getElementById('password').value !== this.value ? 'Passwords do not match.' : '')">
          <div class="invalid-feedback">Passwords must match.</div>
        </div> -->

        <!-- <div class="mb-3 form-check">
          <input id="terms" class="form-check-input" type="checkbox" required>
          <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-decoration-none">terms and privacy</a></label>
          <div class="invalid-feedback">You must agree before continuing.</div>
        </div> -->

        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
      </form>

      <div class="text-center mt-3 small text-muted">
        ¿Ya tiene una cuenta? <a href="signin.html" class="link-primary">Ingresar</a>
      </div>
    </div>
  </div>
</div>

  <!-- Página independiente: no carga main.js ni sidebar.js, no tiene navbar/sidebar -->
  <script src="../libr/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/registro.js"></script>

</body>

</html>
